name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: python -m pip install -e ".[dev]"
      - name: Check Python and LaunchAgent syntax
        run: |
          python -m compileall -q src scripts deploy
          plutil -lint deploy/launchd/zsxq-pipeline.plist.template
      - name: Lint active code and tests
        run: ruff check src scripts deploy tests
      - name: Check repository hygiene
        run: python scripts/check_repository_hygiene.py
      - name: Run tests
        run: python -m pytest -q
