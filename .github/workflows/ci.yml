name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: python -m pip install -e ".[dev]"
      - name: Check shell syntax
        run: |
          shopt -s nullglob
          script_shell_files=(scripts/*.sh)
          if ((${#script_shell_files[@]})); then
            bash -n "${script_shell_files[@]}"
          fi
          digest_shell_files=(openclaw_tasks/zsxq_pdf_digest/*.sh)
          if ((${#digest_shell_files[@]})); then
            bash -n "${digest_shell_files[@]}"
          fi
      - name: Check repository hygiene
        run: python scripts/check_repository_hygiene.py
      - name: Run tests
        run: python -m pytest -q
