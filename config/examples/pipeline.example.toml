# This file is a shape-only example. Keep real paths, source IDs, credentials,
# chat IDs, browser profiles, and local research content out of Git.
schema_version = 1

[runtime]
# Must be an absolute local runtime root. All state paths below must remain
# inside it; paths such as ../pipeline.sqlite3 are rejected.
root = "/absolute/path/to/zsxq-pipeline-runtime"
database = "state/pipeline.sqlite3"

[schedule]
# Every launchd wake executes the same bounded tick.  Source slots remain
# business configuration, not LaunchAgent calendar entries.
timezone = "Asia/Shanghai"
tick_budget_seconds = 240
download_quota = 2
process_quota = 20
outbox_quota = 50
# A longer outage is intentionally visible as a truncated catch-up window.
max_catchup_seconds = 259200

[model]
name = "logical-summary-model"
provider = "logical-provider"
prompt_version = "summary-v1"

[sources.foreign_reports]
kind = "zsxq"
# The JSON files stay outside Git.  The database becomes authoritative after
# the initial import; state_path is retained only as the finalizer's legacy
# read-only checkpoint mirror during cutover.
state_path = "state/foreign_reports.json"
job_config = "/absolute/path/to/zsxq_foreign_reports_job.json"
keyword_file = "/absolute/path/to/interest_keywords.json"
cdp_endpoint = "http://127.0.0.1:9223"
cft_executable = "/Applications/Google Chrome for Testing.app/Contents/MacOS/Google Chrome for Testing"
cft_user_data_dir = "/absolute/path/to/zsxq-cft-profile"
cft_start_url = "https://wx.zsxq.com/group/YOUR_GROUP_ID"
cft_headless = true
cft_window_size = "1440,1200"
workflow_version = "download:v1"
# Preserve the existing foreign-report logical times after cutover.
schedule_times = ["08:00", "12:00", "16:00", "20:30"]

[sources.domestic_cicc]
kind = "zsxq"
state_path = "state/domestic_cicc.json"
job_config = "/absolute/path/to/zsxq_domestic_cicc_reports_job.json"
keyword_file = "/absolute/path/to/zsxq_domestic_cicc_keywords.json"
cdp_endpoint = "http://127.0.0.1:9223"
cft_executable = "/Applications/Google Chrome for Testing.app/Contents/MacOS/Google Chrome for Testing"
cft_user_data_dir = "/absolute/path/to/zsxq-cft-profile"
cft_start_url = "https://wx.zsxq.com/group/YOUR_GROUP_ID"
cft_headless = true
cft_window_size = "1440,1200"
workflow_version = "download:v1"
# Preserve the existing CICC logical times after cutover.
schedule_times = ["08:20", "12:20", "16:20", "20:50"]

[codex]
# Absolute paths are allowed only for installed CLI executables; the release
# entrypoint itself always resolves from runtime/current, never a dev checkout.
command = "codex"
model = "logical-summary-model"
prompt_version = "summary-v1"
reasoning = "high"
timeout_seconds = 600
work_root = "work/codex"

[lark]
command = "lark-cli"
# Keep real profile paths and target chat IDs in the Git-ignored local copy.
config_dir = "/absolute/path/to/lark-cli-profile"
timeout_seconds = 90
docs_identity = "user"
notification_identity = "bot"
notifications_enabled = true
target_chat_id = ""
parent_position = "my_library"

[pipeline]
extractor_version = "ocr-geometry-v2"
summary_max_workers = 2
doc_group_size = 10
doc_group_threshold = 15
max_files_per_document = 20
# Optional durable local projections. Both paths must be absolute when set.
research_library_root = "/absolute/path/to/ResearchLibrary"
obsidian_vault_root = "/absolute/path/to/Obsidian/ResearchVault"

[publish_targets.daily_digest]
kind = "lark"
target = "logical-daily-digest"

[legacy]
# Only `legacy plan` reads this path, and it reads JSON/JSONL/SQLite state
# without changing it. It is intentionally outside runtime.root in most
# migrations.
root = "/absolute/path/to/legacy-zsxq-runtime"
